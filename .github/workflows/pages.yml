name: Publish Repo
run-name: "Pages ${{ inputs.publish_id || github.ref_name }}"

"on":
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      publish_id:
        description: "RepoMgr bootstrap correlation id"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build package index
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y dpkg-dev bzip2
          rm -rf public
          mkdir -p public/debs
          # Preserve site assets while excluding Git metadata and workflows.
          rsync -a --exclude="/public/" --exclude="/.git/" --exclude="/.repomgr-results/" --exclude="/.github/" --exclude="/.review-fixes/" --exclude="/.optimization-fixes/" --exclude="/.gitignore" --exclude="/.gitattributes" ./ public/
          touch public/.nojekyll
          cp -f icon.png CydiaIcon.png public/ 2>/dev/null || true
          cd public
          dpkg-scanpackages --multiversion debs /dev/null > Packages
          rm -f Packages.gz Packages.bz2
          gzip -n -k Packages
          bzip2 -k Packages
          if [ ! -f Release ]; then
            printf 'Origin: %s\nLabel: %s\nSuite: stable\nCodename: sileo\nArchitectures: iphoneos-arm64 iphoneos-arm64e\nComponents: main\nDescription: %s\n' "${GITHUB_REPOSITORY##*/}" "${GITHUB_REPOSITORY##*/}" "${GITHUB_REPOSITORY##*/}" > Release
          fi
          if [ ! -f index.html ]; then
            printf '<!doctype html><meta charset=utf-8><meta name=viewport content=width=device-width><title>%s</title><h1>%s</h1><p>添加此地址到 Sileo。</p>' "${GITHUB_REPOSITORY##*/}" "${GITHUB_REPOSITORY##*/}" > index.html
          fi
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
